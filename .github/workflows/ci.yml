name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Manual runs from the Actions tab ("Run workflow"), same as Hermod's own CI.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # The same two legs as libs/Hermod/.github/workflows/ci.yml, for the same reasons:
    #
    #  * Windows, because that is where this harness is developed, and because a second,
    #    older OpenSSH build judges us there. Note what this leg is NOT: the developer box
    #    runs the fullest suite because WSL gives it the Linux peers, and a hosted Windows
    #    runner has no WSL — so this leg is a subset of what a local Windows run covers,
    #    and it is the Debian leg below that runs the entire suite.
    #  * Debian 13, because that is what Hermod runs on in production. GitHub offers no
    #    Debian runner image, so this leg runs on an Ubuntu runner inside a debian:13
    #    container. Deliberately NOT the official .NET SDK image: that one is still
    #    Debian-12-based with OpenSSL 3.0, and the X25519MlKem768 hybrid key exchange
    #    needs OpenSSL 3.5+ — on the SDK image the post-quantum checks could only skip.
    #
    # fail-fast is off on purpose: "red on exactly one platform" is the most valuable
    # signal this matrix produces, so one leg must not cancel the other.
    #
    # `leg` exists so the two runs can be told apart by name rather than by runner image:
    # the Linux leg runs on ubuntu-latest but IS Debian 13, and an artifact called
    # "test-results-ubuntu-latest" would say the opposite of what it contains.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            leg: windows-latest
          - os: ubuntu-latest
            container: debian:13
            leg: debian-13-container
    name: ${{ matrix.leg }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:

      # This runs BEFORE the checkout, which is the unusual part — and it has to.
      # actions/checkout only produces a git clone when it finds a git binary; without one
      # it silently falls back to downloading a source tarball over the REST API, and that
      # path cannot fetch submodules at all. Here that would not even fail loudly: since
      # libs/Hermod IS the library under test, a tarball checkout would just build nothing
      # and skip everything. So git comes first.
      #
      # The rest is what a bare debian:13 needs before setup-dotnet can install the SDK:
      # curl for the install script, ICU and tzdata for globalization, libssl3t64 (3.5 —
      # this is what makes ML-KEM work) for crypto, ca-certificates for NuGet over HTTPS.
      # Package names verified on trixie.
      #
      # Deliberately minimal: only what git and the SDK install need. Every SSH peer —
      # openssh-client included — arrives with the provisioning step after the checkout,
      # because the script that owns the peer list lives in the repository.
      - name: Install git and the .NET prerequisites (Debian container)
        if: runner.os == 'Linux'
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git libicu76 libssl3t64 libstdc++6 tzdata

      # Unlike Hermod's own CI, which checks Styx out as a sibling directory because nothing
      # pins it, this repository carries both dependencies as submodules — so the checkout
      # has to recurse, and the build is reproducible at the pinned commits. Both .gitmodules
      # URLs are public (https://github.com/Vanaheimr/...), which is what lets this work with
      # no deploy key and no URL rewriting.
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # The same script a developer runs in WSL2, and that is the point: one provisioning
      # contract, exercised by CI on every commit, so it cannot silently rot. Running as
      # root here, it skips the sudo it would use on a developer box (a container has no
      # sudo binary to offer). It installs the peers behind the eight Linux fixtures —
      # sshd, Dropbear, TinySSH (under socat), plink, curl, the Go toolchain for the
      # x/crypto/ssh harness — plus openssh-client for the ten fixtures that drive ssh,
      # sftp and ssh-keygen directly, and it builds the Python virtualenv at
      # interop/.venv-interop/ that the AsyncSSH and Paramiko drivers run under.
      #
      # Trixie ships OpenSSH 10.0p2 against OpenSSL 3.5.6, and that combination is why this
      # leg is the one that actually proves the post-quantum work: both hybrid key exchanges
      # complete against the real client here — mlkem768x25519-sha256 and
      # sntrup761x25519-sha512 — where an older client would negotiate neither.
      #
      # The Python peers come from PyPI rather than apt, and that is a considered choice,
      # not an oversight: trixie's python3-asyncssh is 2.20, and AsyncSSH only gained the
      # PyCA-cryptography ML-KEM path in 2.24 — with the apt package, the AsyncSSH
      # post-quantum check could not pass and the strongest third-party PQ evidence this
      # suite produces would go red or have to be softened into a skip. The venv keeps it
      # green, and PyPI is the same class of per-run dependency as the NuGet restore and
      # the Go module fetch this workflow already performs.
      - name: Provision the interop peers (Debian container)
        if: runner.os == 'Linux'
        run: bash Tests/interop/setup-wsl.sh

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # ssh-agent is an interop peer in its own right, not merely a convenience:
      # OpenSshAgentInteropTests drives our SshAgentClient against the real OpenSSH agent —
      # listing its identities and verifying a signature it produced. That needs a reachable
      # agent holding at least one key, and a fresh container has neither, so the check would
      # report "No ssh-agent reachable: SSH_AUTH_SOCK is not set" and skip.
      #
      # ssh-agent forks into the background, so it outlives this step; SSH_AUTH_SOCK travels
      # to the later ones through $GITHUB_ENV. The key is generated here and dies with the
      # job — it authenticates nothing and exists only to be signed with.
      #
      # Not done on the Windows leg: there the agent is a system service that is disabled by
      # default, and starting it is a service-management step that has not been verified on a
      # hosted runner. So this single check stays skipped on Windows — deliberately, rather
      # than by adding an unverified step.
      - name: Start an ssh-agent holding one throwaway identity (Debian container)
        if: runner.os == 'Linux'
        run: |
          eval "$(ssh-agent -s)"
          ssh-keygen -t ed25519 -f "${RUNNER_TEMP}/ci-agent-key" -N "" -q
          ssh-add -q "${RUNNER_TEMP}/ci-agent-key"
          echo "SSH_AUTH_SOCK=${SSH_AUTH_SOCK}" >> "${GITHUB_ENV}"

      # Dropbear refuses an authorized-keys file unless its *entire* directory path — every
      # element from the file up to the root — is owned by the user or root and not writable
      # by group or others. The runner creates this container's HOME (/github/home) writable
      # by everyone, so the one Dropbear check that actually authenticates failed here with
      # "/github/home must be owned by user or root, and not writable by group or others"
      # while every developer box passed it, their $HOME being 0755. That asymmetry is why
      # it took a hosted runner to surface it at all.
      #
      # The loop rather than a single chmod: reproduced locally that the walk really is the
      # whole chain — a tight HOME under a 0777 parent fails too, and the log then names the
      # parent instead.
      #
      # Deliberately here and not in setup-wsl.sh: on a developer machine that script would
      # quietly re-mode the user's own home directory, which is nobody's business but theirs.
      # A container's directories are this job's to fix.
      #
      # The rule has two clauses, and tightening the modes only satisfied one: with the whole
      # chain walked and chmod'ed, Dropbear returned the same sentence byte for byte. What it
      # objects to is therefore the *ownership* — the runner creates /github/home for a uid
      # that is not the one this container runs as, and "owned by the user or root" then holds
      # for neither. Hence the chown, and hence the ls on both sides of it: if this ever fails
      # again the log will say which of the two clauses is still open, instead of leaving the
      # next person to deduce it from a message that never changes.
      - name: Tighten the container HOME for Dropbear's path check (Debian container)
        if: runner.os == 'Linux'
        run: |
          id
          d="${HOME:?}"
          while [ "${d}" != "/" ] && [ "${d}" != "." ]; do
            ls -ld "${d}"
            chown "$(id -u):$(id -g)" "${d}" || echo "  chown refused for ${d} (bind mount?)"
            chmod go-w "${d}"
            ls -ld "${d}"
            d="$(dirname "${d}")"
          done

      - name: Build
        run: dotnet build Tests/Tests.csproj --configuration Release

      # What this gate covers.
      #
      # Ten fixtures drive real OpenSSH binaries in-process and run on both legs:
      # OpenSshAuth, OpenSshCertificate, OpenSshExec, OpenSshHostKeyRotation,
      # OpenSshKeyFormat, OpenSshSftp, OpenSshSshfp, OpenSshTransport (all needing
      # openssh-client), OpenSshAgent (needing the agent above) and SshNet — the last one a
      # pure-managed NuGet peer that needs nothing installed at all.
      #
      # The other eight — AsyncSsh, CurlLibSsh, Dropbear, GoCryptoSsh, OpenSshServer,
      # Paramiko, Plink and TinySsh — reach their peers through interop/WslInterop.cs,
      # which runs the same commands through wsl.exe on Windows and natively on Linux.
      # With the provisioning step above, the Debian leg is the first place the entire
      # suite runs on every commit: all 95 checks, nothing skipped — about 30 seconds of
      # test time on a hosted runner, 17 in a local Debian 13 provisioned the same way.
      # What PLAN §11.6 keeps for a separate nightly job is the *version spread* — the
      # OpenSSH 8.9/9.6/9.9 containers, the Tier 3 peers — not this suite at trixie's
      # own peer versions, which costs seconds.
      #
      # The Windows leg reaches those eight no further — the hosted images install no WSL
      # distro — and lands at 40 of 95. What it adds is the Windows OpenSSH: a genuinely
      # different build against a different TLS stack, driving the same server.
      #
      # It is not, however, an older one. That was assumed here at first and the artifacts
      # disproved it: the transport fixture passes 12 of 12 on this leg, both hybrid key
      # exchanges included. The 9.5p2 client that advertises neither is what sits on a typical
      # developer Windows box, where those two cases skip by name — so the version spread this
      # matrix covers is between CI and the desk, not between the two legs.
      - name: Test
        timeout-minutes: 20
        run: dotnet test Tests/Tests.csproj --configuration Release --no-build --logger "console;verbosity=normal" --logger "trx;LogFileName=${{ matrix.leg }}.trx" --results-directory artifacts

      # Which checks ran, which skipped and with what reason is the single most useful thing
      # this workflow knows, and it is exactly what the console log does not preserve once a
      # run ages out. TRX keeps it per test, including the skip reason — and this repository
      # already has the consumer: InteropReport reads TRX files or directories recursively
      # and renders docs/INTEROP-MATRIX.md from them, so an artifact downloaded from here
      # feeds straight into
      #     dotnet run --project InteropReport -- <the extracted directory>
      #
      # !cancelled() rather than success(): a red run is when these files matter most, and
      # uploading only on green would throw away the evidence in exactly that case. A build
      # that fails before the test step leaves no .trx at all, which upload-artifact reports
      # as a warning rather than a second failure — the build error is the finding there.
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.leg }}
          path: artifacts/*.trx
