name: Nightly

# The counterpart to ci.yml, split the same way Hermod's own nightly is split:
# a fatal half whose red means our code broke, and an informational half whose
# red means something outside this repository moved. Mixing the two is what
# stops a night from being read at all — a gate that can go red because a mirror
# was slow gets ignored within a week — so they are separate steps here, with
# different failure semantics and their own .trx files.
#
# FATAL — the suite the gate runs, three times in a row.
#
#   That sounds redundant and is not. A gate runs each commit once, so a failure
#   that appears once and never reproduces locally is indistinguishable from
#   noise — the run where "An existing connection was forcibly closed by the
#   remote host" showed up a single time is still unexplained for exactly that
#   reason. Three runs a night turn it into a number: one of three is a flake and
#   says so, three of three is a regression, and a suite that only fails in runs
#   2 and 3 is telling us it does not clean up after itself. All three are
#   findings; a single run can report none of them.
#
# INFORMATIONAL — the newest upstream OpenSSH, built from source.
#
#   This is the forward half of the version spread PLAN §11.6 asks for, and the
#   only half that can be had at all today: 8.9/9.6/9.9 exist as era-matched
#   distribution packages, but the behaviour gates §11.1 names — ≥ 10.3 (empty
#   cert principals match nothing, IANA agent names) and ≥ 10.4 (disconnect on
#   non-KEX traffic during post-auth rekey) — ship in no distribution whatsoever.
#   Debian 13 stops at 10.0p2; upstream was at 10.5p1 when this was written.
#
#   It discovers the newest release rather than pinning one, which is the whole
#   reason it belongs in a nightly: the question worth asking every morning is
#   "does the OpenSSH released yesterday still talk to us", and a pinned version
#   stops asking it the day after it is written.
#
#   Informational because almost everything that can go wrong in it is not ours:
#   a CDN that times out, a mirror listing that changes shape, a configure that
#   wants a header this container lacks. A red here is a prompt to look, not a
#   regression — and when it IS a real interop break, the fatal half above stayed
#   green and the summary names the exact upstream version that broke us.
#
#   The backward half — 8.9/9.6/9.9 through era-matched container images — is
#   still open, and deliberately so: it is a different mechanism (images, not a
#   build) and setup-wsl.sh has no version knob to hang it on.
#
# REFEREE -- the same suite against both submodules' current master.
#
#   This file used to say it deliberately did not do this, on dependabot.yml's
#   argument: a red night names no commit and leaves nothing to merge, while a
#   pin PR's verdict is "this pin merged into master". That argument was right
#   and the pull request is still the mergeable answer, so the two now run side
#   by side rather than one replacing the other.
#
#   What the referee adds is latency and the thing the objection asked for. It
#   asks nightly instead of once at 05:00, and before moving anything it writes
#   each pin and the whole commit range between that pin and its master into the
#   summary -- so a red morning reads "these ten Hermod commits and this one
#   Styx commit contain it", which is where a bisect would start.
#
# Two things worth knowing about scheduled workflows, both inherited from Hermod's
# nightly: they only ever run on the default branch — so this file cannot be
# tested in a pull request, only through "Run workflow" — and GitHub disables them
# after 60 days without repository activity. If the nights stop arriving, that is
# the first thing to check.
on:
  schedule:
    # 02:41 UTC. Not on the hour, because GitHub's scheduler is busiest there and
    # delays runs by tens of minutes; offset from Hermod's own 02:17 so the two
    # repositories' nights do not arrive as one indistinguishable block.
    - cron: '41 2 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repeat-suite:
    # The same two legs as ci.yml, for the same reasons — see the comments there:
    # in short, Windows because that is where this harness is developed and where
    # a second OpenSSH build judges us, and Debian 13 in a bare debian:13 container
    # because that is production and because trixie's OpenSSL 3.5 is what makes the
    # hybrid key exchanges actually run instead of skip.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            leg: windows-latest
          - os: ubuntu-latest
            container: debian:13
            leg: debian-13-container
    name: ${{ matrix.leg }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:

      # Everything up to the build is ci.yml's setup, unchanged and for the
      # reasons documented there. Repeating those comments here would guarantee
      # the two copies drift apart, so they are not repeated — but the steps
      # themselves have to be identical, because the whole premise of the fatal
      # half is that it runs the same thing the gate runs.

      # Before the checkout on purpose: actions/checkout falls back to a REST
      # tarball without a git binary, and a tarball cannot fetch submodules.
      - name: Install git and the .NET prerequisites (Debian container)
        if: runner.os == 'Linux'
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git libicu76 libssl3t64 libstdc++6 tzdata

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Provision the interop peers (Debian container)
        if: runner.os == 'Linux'
        run: bash Tests/interop/setup-wsl.sh

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Start an ssh-agent holding one throwaway identity (Debian container)
        if: runner.os == 'Linux'
        run: |
          eval "$(ssh-agent -s)"
          ssh-keygen -t ed25519 -f "${RUNNER_TEMP}/ci-agent-key" -N "" -q
          ssh-add -q "${RUNNER_TEMP}/ci-agent-key"
          echo "SSH_AUTH_SOCK=${SSH_AUTH_SOCK}" >> "${GITHUB_ENV}"

      - name: Tighten the container HOME for Dropbear's path check (Debian container)
        if: runner.os == 'Linux'
        run: |
          id
          d="${HOME:?}"
          while [ "${d}" != "/" ] && [ "${d}" != "." ]; do
            ls -ld "${d}"
            chown "$(id -u):$(id -g)" "${d}" || echo "  chown refused for ${d} (bind mount?)"
            chmod go-w "${d}"
            ls -ld "${d}"
            d="$(dirname "${d}")"
          done

      - name: Build
        run: dotnet build Tests/Tests.csproj --configuration Release

      # ---------------------------------------------------------------------
      # The fatal half.
      # ---------------------------------------------------------------------
      #
      # Three runs against one provisioning, which is what makes this affordable:
      # the suite itself costs about 30 seconds on a hosted runner, while apt, pip
      # and the Go module fetch above cost minutes. Repeating the cheap part is
      # nearly free, and it is the part that varies.
      #
      # set +e rather than letting the step die on the first red run: "1 of 3
      # failed" and "3 of 3 failed" are different findings, and aborting after the
      # first would collapse them into the same one. Each run keeps its own .trx,
      # so a night that goes partly red can be compared test by test rather than
      # by counter — which is the difference between "84 failed" and "84 different
      # ones failed", a distinction Hermod's nightly had to learn the hard way.
      #
      # shell: bash on both legs, Git Bash on Windows. GITHUB_STEP_SUMMARY takes a
      # Windows path there and the redirect handles it — the same pattern Hermod's
      # nightly already runs on both of its legs.
      - name: Test the pinned suite, three times (fatal)
        timeout-minutes: 40
        shell: bash
        run: |
          set +e
          rows="${RUNNER_TEMP}/rows.md"
          : > "${rows}"
          failed=0
          #
          # A skipped check counts as a failed run on the Debian leg, the same
          # way it does in ci.yml and for the same reason: setup-wsl.sh put
          # every peer there, so a fixture that gates itself out could not use
          # one that is installed, and a run of nothing but skips would be
          # tabled as "passed". On Windows the skips are honest -- every check
          # that needs a WSL peer skips, there being no WSL distro on the
          # runner -- so the check is Linux-only, and the table says which of
          # the two kinds of failure a run had.
          #
          # tee with PIPESTATUS rather than a plain redirect: the per-run output
          # has to stay visible inside its ::group:: fold, and the exit status
          # that matters is dotnet's, not tee's.
          for i in 1 2 3; do
            echo "::group::run ${i} of 3"
            dotnet test Tests/Tests.csproj --configuration Release --no-build \
              --logger "console;verbosity=normal" \
              --logger "trx;LogFileName=${{ matrix.leg }}-run${i}.trx" \
              --results-directory artifacts 2>&1 | tee "${RUNNER_TEMP}/run${i}.txt"
            rc=${PIPESTATUS[0]}
            echo "::endgroup::"
            skipped=0
            if [ "${RUNNER_OS}" = "Linux" ]; then
              for n in $(grep -oE 'Skipped: +[0-9]+' "${RUNNER_TEMP}/run${i}.txt" | grep -oE '[0-9]+'); do
                skipped=$((skipped + n))
              done
            fi
            if [ "${rc}" -ne 0 ]; then
              failed=1
              echo "| ${i} | **failed** (exit ${rc}) |" >> "${rows}"
            elif [ "${skipped}" -ne 0 ]; then
              failed=1
              echo "| ${i} | **failed** (${skipped} skipped) |" >> "${rows}"
            else
              echo "| ${i} | passed |" >> "${rows}"
            fi
          done
          {
            echo '## Pinned suite, three runs (${{ matrix.leg }})'
            echo
            echo 'Three runs of the same suite against one provisioning. A mixed'
            echo 'column is the finding this half exists for.'
            echo
            echo '| Run | Outcome |'
            echo '|---|---|'
            cat "${rows}"
          } >> "${GITHUB_STEP_SUMMARY}"
          exit ${failed}

      # ---------------------------------------------------------------------
      # The informational half.
      # ---------------------------------------------------------------------
      #
      # Linux only. The Windows leg has no compiler toolchain wired up and reaches
      # none of the WSL peers anyway; adding a source build there would be an
      # unverified step for a leg that already covers what it is here to cover —
      # the Microsoft OpenSSH build, at its own version.
      #
      # Why this needs no change to the harness: every OpenSSH fixture resolves
      # its binary through PATH — FindOnPathOrSystem("ssh"), and `command -v sshd`
      # for the server side — so prepending the install prefix is the entire
      # integration. Both bin and sbin, because that `command -v sshd` finds
      # nothing in bin. No filter file, no configuration switch, no #if.
      #
      # The filter selects the fixtures that drive an OpenSSH binary. The other
      # peers (Dropbear, TinySSH, AsyncSSH, Paramiko, Go, plink, curl, SSH.NET)
      # are unaffected by which OpenSSH is on PATH and already ran three times in
      # the fatal half, so running them again here would only cost minutes and
      # blur which version a result belongs to.
      #
      # Every early exit goes through emit() so a night that gave up still says
      # where. The scratch files are absolute paths under RUNNER_TEMP on purpose,
      # twice over: the build runs in a subshell that cd's into the unpacked
      # tarball, so a relative name would scatter the summary across two files and
      # print whichever half the last cd left us in — and keeping them out of the
      # workspace leaves the checkout as clean as it was found.
      #
      # continue-on-error AND a trailing exit 0: the first keeps a red step from
      # failing the job, the second keeps set +e from letting some earlier
      # command's status leak out as the step's. Hermod's live-DNS step uses both
      # for the same reason.
      - name: Interop against the newest upstream OpenSSH (informational)
        if: runner.os == 'Linux'
        continue-on-error: true
        timeout-minutes: 30
        shell: bash
        run: |
          set +e
          SUMMARY="${RUNNER_TEMP}/upstream-summary.md"
          LOG="${RUNNER_TEMP}/upstream-test.txt"
          : > "${SUMMARY}"
          # tee, so a note reaches the step log as well as the summary. Anybody
          # investigating a red lane from the command line reads the log, and a
          # plain redirect leaves the one thing they need first -- which upstream
          # release this ran against -- visible only in a browser. The same
          # redirect cost NTSConformanceTests a round trip today.
          note() { echo "$1" | tee -a "${SUMMARY}"; }
          emit() {
            {
              echo '## Newest upstream OpenSSH (${{ matrix.leg }}, informational)'
              echo
              echo 'The forward half of the version spread PLAN §11.6 asks for. A failure'
              echo 'here is a prompt to look at the named release, not a regression in this'
              echo 'tree — the fatal half above is what speaks for our code.'
              echo
              cat "${SUMMARY}"
            } >> "${GITHUB_STEP_SUMMARY}"
          }

          echo "::group::build prerequisites"
          apt-get install -y --no-install-recommends build-essential zlib1g-dev libssl-dev libpam0g-dev
          prereq=$?
          echo "::endgroup::"
          if [ ${prereq} -ne 0 ]; then
            note '- could not install the build prerequisites — nothing was tested'
            emit
            exit 0
          fi

          # Discover rather than pin. Verified against the live listing on
          # 2026-08-13: the newest release was openssh-10.5p1, while this
          # container's own OpenSSH is 10.0p2 — so there is a real gap to test
          # across, and it is the gap §11.1 names.
          base="https://cdn.openbsd.org/pub/OpenBSD/OpenSSH/portable"
          tarball="$(curl -s --max-time 60 "${base}/" \
                     | grep -oE 'openssh-[0-9]+\.[0-9]+p[0-9]+\.tar\.gz' \
                     | sort -Vu | tail -1)"
          if [ -z "${tarball}" ]; then
            note '- could not determine the newest release from the mirror listing — nothing was tested'
            emit
            exit 0
          fi
          release="${tarball%.tar.gz}"
          note "- newest upstream release: \`${release}\`"
          note "- this container ships: \`$(ssh -V 2>&1)\`"

          # Configured into a private prefix and actually INSTALLED, rather than run
          # out of the build directory — and the first real run is what taught us
          # every word of that. It came back 32 of 43, and the eleven failures were
          # no disagreement with 10.5p1 at all: every check driven by their ssh
          # client against our server passed, both hybrid key exchanges included,
          # while everything needing their sshd died before it ever listened.
          #
          #     command-line line 0: Unsupported option UsePAM
          #     /usr/local/etc/sshd_config: No such file or directory
          #
          # Three separate consequences of building the lazy way — and the fixture
          # owns the sshd command line, so not one of them can be worked around
          # from in here:
          #
          #  * --without-pam makes sshd REJECT `-o UsePAM=no` as an unknown option
          #    and exit. The fixture passes it unconditionally and is right to,
          #    because the distribution sshd is built with PAM. Nothing here
          #    authenticates through PAM; the option merely has to be recognised.
          #  * With no --prefix, sshd looks for its configuration under
          #    /usr/local/etc and gives up when it is not there.
          #  * Since 9.8 sshd re-executes $libexecdir/sshd-session for every
          #    connection, so even a started sshd would have failed at the first
          #    one, nothing having been installed anywhere.
          #
          # A private prefix answers all three at once and leaves the distribution's
          # /etc/ssh untouched: configuration, privilege-separation directory and
          # helper binaries all land under RUNNER_TEMP and die with the runner.
          # install-nokeys because the fixture brings its own host key with -h, and
          # generating a set here would only cost seconds nobody gets back.
          #
          # A subshell so the cd's stay in here and the test below still runs from
          # the workspace. Plain `make`, not a hand-picked target list: the default
          # target is the trodden path, and naming targets invites a parallel build
          # to race on libssh.a.
          echo "::group::build ${release}"
          prefix="${RUNNER_TEMP}/upstream/prefix"
          ( mkdir -p "${RUNNER_TEMP}/upstream" \
            && cd "${RUNNER_TEMP}/upstream" \
            && curl -sSfL --max-time 300 -O "${base}/${tarball}" \
            && tar xzf "${tarball}" \
            && cd "${release}" \
            && ./configure --prefix="${prefix}" --with-pam \
            && make -j"$(nproc)" \
            && make install-nokeys )
          built=$?
          echo "::endgroup::"

          upstream="${prefix}/bin"
          if [ ${built} -ne 0 ] || [ ! -x "${upstream}/ssh" ]; then
            note '- **the build produced no ssh binary** — see the group above; nothing was tested'
            emit
            exit 0
          fi
          note "- built as: \`$("${upstream}/ssh" -V 2>&1)\`"

          echo "::group::OpenSSH fixtures against ${release}"
          PATH="${upstream}:${prefix}/sbin:${PATH}" dotnet test Tests/Tests.csproj --configuration Release --no-build \
            --filter "FullyQualifiedName~OpenSsh" \
            --logger "console;verbosity=normal" \
            --logger "trx;LogFileName=${{ matrix.leg }}-upstream.trx" \
            --results-directory artifacts 2>&1 | tee "${LOG}"
          echo "::endgroup::"

          note ''
          note '```'
          grep -E "Passed!|Failed!|Total tests|Passed:|Failed:|Skipped:" "${LOG}" >> "${SUMMARY}" \
            || tail -5 "${LOG}" >> "${SUMMARY}"
          note '```'
          emit
          exit 0

      # Three .trx per leg from the fatal half, plus one from the informational
      # half on Linux. Named apart from the gate's artifact so a downloaded
      # directory says which workflow produced it — InteropReport reads a
      # directory recursively, and mixing a nightly's runs into a gate's one would
      # render a matrix nobody can attribute.
      #
      # continue-on-error on the upstream step means it counts as successful here,
      # so !cancelled() collects its .trx even on a night that half went red.
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: nightly-test-results-${{ matrix.leg }}
          path: artifacts/*.trx

  # ---------------------------------------------------------------------------
  # The referee job: the same suite against both submodules' current master.
  # ---------------------------------------------------------------------------
  against-submodule-masters:
    # Everything above tests the revisions the gitlinks pin, which is the right
    # question for "would a fresh clone build". It is the wrong question for what
    # this repository claims to be: a referee that can be pointed at any Hermod
    # revision. A push to Hermod does not touch this repository at all, so no
    # job here notices it.
    #
    # dependabot.yml closes that too, and its argument against a nightly doing
    # it was specific: a red night names no commit and leaves nothing to merge,
    # while a pin PR's verdict is "this pin merged into master", which is the
    # question a bump actually asks. That argument stands, and this job does not
    # replace it -- the PR remains the mergeable answer. What this adds is
    # latency and the thing the objection asked for.
    #
    # Latency: dependabot proposes at 05:00 and GitHub applies its own ordering
    # to when a PR appears, so a break can sit unseen for a working day. This
    # asks every night, against master as it stands.
    #
    # And it names commits. Before moving anything, the step below writes the
    # pinned revisions and then the full commit range between each pin and its
    # master into the summary. A red morning therefore reads "these ten Hermod
    # commits and this one Styx commit contain it", which is a day's worth of
    # range and the same material a bisect would start from -- not a date.
    #
    # Red here is a finding rather than a breakage, and it is still fatal to the
    # night on purpose, the way NTS's and DNS's referees are: nothing else in
    # this workflow can go red for a reason outside this tree, so a red night
    # means exactly one thing. If the mornings turn noisy because master is
    # routinely ahead, continue-on-error on this job is the one-line answer.
    #
    # The whole suite runs, not a hermetic subset. NTS and DNS keep their
    # referees to the offline gate because they have one; here the interop
    # fixtures ARE the suite, so an offline-only referee would be a referee of
    # almost nothing. That means this job provisions every peer, exactly as the
    # gate's Debian leg does.
    #
    # Both submodules move, and Styx is not an afterthought: Hermod's own CI
    # checks Styx out at master unpinned, so Hermod's master is only ever tested
    # against Styx's master, and a lagging Styx pin is a combination nothing
    # else verifies. dependabot.yml groups them into one PR for the same reason.
    runs-on: ubuntu-latest
    container: debian:13
    steps:

      # Before the checkout, and needed again afterwards to move the gitlinks.
      - name: Install git and the .NET prerequisites (Debian container)
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git libicu76 libssl3t64 libstdc++6 tzdata

      # fetch-depth 0, which the gate's legs do not need and this job does. The
      # default is a depth-1 clone and a `submodule update --depth=1`, so each
      # submodule arrives with one commit of history -- enough to build against,
      # and not enough to say what changed. The first run of this job proved it
      # rather than implied it: it reported "libs/Hermod: 1 commits" where the
      # range was really ten, and the summary would have listed one of them. The
      # commit range is the whole reason this job is defensible next to
      # dependabot's pull request, so the history it needs is not optional.
      #
      # It costs very little: both submodules' objects live in the
      # superproject's .git, which is about 50 MB in full, against a job that
      # spends two and a half minutes provisioning peers.
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      # The pins are recorded before they are moved, because afterwards there is
      # nothing left to compare against -- and the comparison is the point.
      #
      # A plain loop over .gitmodules rather than `git submodule foreach`: the
      # body needs double quotes for the headings and single quotes for the
      # markdown fences, and nesting those inside foreach's own quoted argument
      # is how a fence ends up being read as command substitution by sh. A third
      # submodule joins this loop by existing, with nothing to edit here.
      - name: Move both submodules to master, and say what that changes
        run: |
          set -e
          git config --global --add safe.directory '*'
          {
            echo '### What the gate pins'
            echo '```'
            git submodule status
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          for sm in $(git config --file .gitmodules --get-regexp path | awk '{print $2}'); do
            pin="$(git -C "${sm}" rev-parse HEAD)"
            git -C "${sm}" fetch -q origin master
            tip="$(git -C "${sm}" rev-parse FETCH_HEAD)"
            n="$(git -C "${sm}" rev-list --count "${pin}..${tip}")"
            {
              echo
              echo "#### ${sm} — ${n} commit(s) past the pin"
              echo '```'
              git -C "${sm}" log --oneline --no-decorate "${pin}..${tip}" || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "${sm}: ${pin} -> ${tip} (${n} commits)"
            git -C "${sm}" checkout -q FETCH_HEAD
          done

      # From here on this is the gate's Debian leg, step for step. The comments
      # live in ci.yml; repeating them here would guarantee the copies drift.
      - name: Provision the interop peers (Debian container)
        run: bash Tests/interop/setup-wsl.sh

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Start an ssh-agent holding one throwaway identity (Debian container)
        run: |
          eval "$(ssh-agent -s)"
          ssh-keygen -t ed25519 -f "${RUNNER_TEMP}/referee-agent-key" -N "" -q
          ssh-add -q "${RUNNER_TEMP}/referee-agent-key"
          echo "SSH_AUTH_SOCK=${SSH_AUTH_SOCK}" >> "${GITHUB_ENV}"

      - name: Tighten the container HOME for Dropbear's path check (Debian container)
        run: |
          id
          d="${HOME:?}"
          while [ "${d}" != "/" ] && [ "${d}" != "." ]; do
            ls -ld "${d}"
            chown "$(id -u):$(id -g)" "${d}" || echo "  chown refused for ${d} (bind mount?)"
            chmod go-w "${d}"
            ls -ld "${d}"
            d="$(dirname "${d}")"
          done

      - name: Build
        run: dotnet build Tests/Tests.csproj --configuration Release

      # A skip is a failure here for the same reason it is in the gate: every
      # peer was installed three steps up, so a check that gates itself out
      # could not use one that is demonstrably there, and a referee reporting
      # agreement it never measured is worse than no referee. No runner check
      # around it -- this job only ever runs on Linux.
      - name: Test the suite against both masters
        timeout-minutes: 25
        shell: bash
        run: |
          set +e
          dotnet test Tests/Tests.csproj --configuration Release --no-build \
            --logger "console;verbosity=normal" \
            --logger "trx;LogFileName=against-submodule-masters.trx" \
            --results-directory artifacts > "${RUNNER_TEMP}/referee.out" 2>&1
          rc=$?
          cat "${RUNNER_TEMP}/referee.out"
          skipped=0
          passed=0
          failed=0
          for n in $(grep -oE 'Skipped: +[0-9]+' "${RUNNER_TEMP}/referee.out" | grep -oE '[0-9]+'); do
            skipped=$((skipped + n))
          done
          for n in $(grep -oE 'Passed: +[0-9]+' "${RUNNER_TEMP}/referee.out" | grep -oE '[0-9]+'); do
            passed=$((passed + n))
          done
          for n in $(grep -oE 'Failed: +[0-9]+' "${RUNNER_TEMP}/referee.out" | grep -oE '[0-9]+'); do
            failed=$((failed + n))
          done
          # Stated against itself rather than against a number written in here:
          # a constant goes stale the first time a check is added, and the verdict
          # never depended on it -- zero skips and a zero exit mean "everything ran
          # and passed" for a suite of any size.
          {
            echo
            echo '### Verdict against both masters'
            echo
            echo "${passed} of $((passed + skipped + failed)) checks passed, ${skipped} skipped, ${failed} failed."
          } >> "$GITHUB_STEP_SUMMARY"
          [ "${rc}" -eq 0 ] || exit "${rc}"
          if [ "${skipped}" -ne 0 ]; then
            echo "FAIL: ${skipped} checks skipped although every peer was provisioned."
            exit 1
          fi

      # Named apart from the two legs above so a downloaded directory says which
      # question produced it. InteropReport reads a directory recursively, and a
      # referee's run mixed into the pinned ones would render a matrix that
      # cannot be attributed.
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
