version: 2

# The counterpart to the two workflows — and deliberately not a third one.
#
# ci.yml tests what the submodule pointers say, never what libs/Hermod has done
# since. For a gate that is the right behaviour: a reproducible build at pinned
# commits. But it leaves a blind spot with a name. The SSH implementation and its
# hermetic tests live inside Hermod, so Hermod's own CI does cover them — what it
# cannot cover is this repository's Tests/interop/, which is the only place our
# code meets a real peer. A change in Hermod that passes its hermetic suite and
# still breaks conformance stays invisible here until somebody bumps the pin by
# hand. Commit 7575e17 is what that looks like when it works, and it only worked
# because the drift happened to be noticed.
#
# A nightly on its own would answer in the wrong currency: a red night that names
# no commit leaves nothing to merge. Dependabot answers in pull requests. And
# because
# GitHub builds a pull_request run from refs/pull/N/merge — the PR merged into
# master's current tip, not the PR's own commit — the verdict on such a PR is
# "this pin, merged into master", which is exactly the question a pin bump asks.
# Green means the bump is safe and one click applies it; red names the commit
# range that broke us while that range is still one day wide.
#
# Both submodules are covered, and Styx is not an afterthought here. Hermod's own
# CI checks Styx out as a sibling at master, unpinned, and says so in its comments
# — so Hermod's master is only ever tested against Styx's master. Every day our
# Styx pin lags is a day we build a combination that nothing else verifies.
#
# .gitmodules names no branch for either submodule, so each is followed on its own
# repository's default branch, which is master for both.
#
# Since 2026-10-04 nightly.yml also carries a referee job against both masters,
# and the two are complementary rather than competing. This file stays the
# mergeable answer -- one click, judged as "this pin merged into master". The
# referee answers sooner, every night rather than once at 05:00, and it was built
# to meet the objection above: it writes each pin and the full commit range
# between that pin and its master into the night's summary before moving
# anything, so a red morning names the commits rather than the date.

updates:
  - package-ecosystem: gitsubmodule
    directory: /

    # Daily rather than weekly: the entire value of this file is a small commit
    # range when something breaks, and a week of Hermod is not a small range —
    # the last sync alone spanned 15 commits. Daily is not one PR per day either;
    # Dependabot updates an already-open PR in place rather than opening a second
    # one, so the ceiling is one open PR for the group defined below.
    #
    # 05:00 UTC is after the nightly below has had its two-and-a-half hours, so a
    # single look in the morning finds both the night's verdict and the day's pin
    # proposal. That is a convenience, not a dependency: the PR triggers its own
    # ci.yml run and does not read the nightly's result.
    schedule:
      interval: daily
      time: "05:00"
      timezone: Etc/UTC

    # "daily" alone did not mean daily, and the first run proved it rather than
    # implied it. Both submodules had moved — Hermod by 16 commits, Styx by 3 —
    # and it opened nothing, reporting:
    #
    #     Filtered out 16 versions due to cooldown
    #     All versions filtered by cooldown for libs/Hermod, falling back to
    #     current version 638700e8...
    #
    # GitHub applies a three-day cooldown to version updates even when the option
    # is absent. An unconfigured pin therefore trails master by at least that much,
    # which is defensible for a dependency pin — you never chase an hour-old commit
    # — but it is not what this file was written to do, and leaving it unstated
    # would have been the kind of comment that quietly lies.
    #
    # Hence the explicit zero — and it is honoured, which settles a contradiction
    # worth writing down. GitHub's options reference lists gitsubmodule among the
    # ecosystems that do NOT support cooldown; the run quoted above shows the
    # default being applied to it regardless, and the run right after this line
    # was added dropped the filter and opened both pins on the spot (#6 libs/Styx,
    # #7 libs/Hermod). The reference is wrong about this ecosystem in both
    # directions at once, so do not "clean up" this key on its authority.
    cooldown:
      default-days: 0

    # One pull request for both submodules — correctness, not tidiness.
    #
    # libs/Hermod and libs/Styx do not evolve independently: Hermod's master
    # regularly calls a Styx API that arrived days earlier. One PR per submodule
    # means each is built against the OTHER's old pin — a combination that exists
    # nowhere and that nobody will ever ship. On 2026-10-04 that is precisely how
    # it failed, on both legs:
    #
    #     Hermod/HTTP/Passkeys/WebAuthn.cs(206,67): error CS1061:
    #     'CBORValue' does not contain a definition for 'GetValue'
    #
    # GetValue(CBORValue) had landed in Styx c530de16 while the Hermod-only PR
    # left Styx on the old pin. The same pattern had turned both pin PRs red on
    # 2026-08-14, undiagnosed at the time, and it cost an afternoon to find the
    # second time. Grouped, CI judges the combination this repository is actually
    # going to carry.
    #
    # The pattern is "*" rather than the two paths by name so that a third
    # submodule joins the group by existing, instead of quietly getting its own
    # pull request and its own impossible combination.
    groups:
      submodules:
        patterns:
          - "*"

    # With that group there is at most one pin PR at a time, so this is a backstop
    # rather than a budget: it keeps an ungrouped entry, should one ever be added,
    # from opening five at once.
    open-pull-requests-limit: 2

    labels:
      - dependencies

    # No commit-message prefix on purpose. This repository writes commit subjects
    # as sentences — "Follow Hermod's master again, two DNS commits on" — and a
    # "chore(deps):" would be the only one of its kind in the log. Dependabot's
    # own "Bump libs/Hermod from X to Y" stays on the PR's commit, where it is
    # accurate and unremarkable; the merge commit is where the real message goes.

  # The Russh peer (Tests/interop/russh/). Like the Go peer below, and unlike
  # every apt-provisioned peer, no distribution update ever moves it: Cargo.toml pins
  # russh and russh-sftp exactly and Cargo.lock pins every crate beneath them. That
  # makes each run reproducible, and without this entry it would also make the
  # peer age in silence — the suite would keep testing against the Russh of the
  # day it was wired in, while the Russh that Warpgate and other Rust services
  # ship moved on.
  - package-ecosystem: cargo
    directory: /Tests/interop/russh

    # Weekly: this is a peer under test, not code we ship, and a week of crates.io
    # is still a range one PR can name.
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC

    # A week of cooldown, the opposite choice from the submodules above and for
    # the opposite reason. There the commits are our own and the point is to see
    # them early; here they are strangers' releases fetched at test time, and a
    # compromised or broken crate is usually yanked within days. Waiting costs
    # nothing a conformance suite needs.
    cooldown:
      default-days: 7

    # One PR for all crates. russh and russh-sftp release in step, and a PR that
    # moves one of them alone builds a pair nobody ships — the same argument as
    # the submodule group above.
    groups:
      russh-peer:
        patterns:
          - "*"

    open-pull-requests-limit: 2

    labels:
      - dependencies

    # What this entry cannot do: rust-toolchain.toml pins the compiler, and a
    # Russh release that raises its minimum Rust turns the PR red on the Debian
    # leg, the one that builds the peer.
    # The fix is to raise the channel in rust-toolchain.toml on the same PR;
    # setup-wsl.sh installs whatever that file names.

  # The Go peer (Tests/interop/go/), for the same reason as Russh: go.mod and
  # go.sum pin golang.org/x/crypto and github.com/pkg/sftp, and nothing apt
  # does moves them. Until 2026-11-26 go.mod named only x/crypto and the harness
  # ran 'go mod tidy', which resolved pkg/sftp to whatever was newest on the day
  # of the run - a peer that changed under the suite with no commit to show for
  # it. Now the harness runs a plain 'go build', and this entry is how the pins
  # move.
  - package-ecosystem: gomod
    directory: /Tests/interop/go

    # Weekly, a week's cooldown and one grouped PR, as for the crates above and
    # for the same reasons: a peer under test, strangers' releases, and x/crypto
    # and x/sys moving together.
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC

    cooldown:
      default-days: 7

    groups:
      go-peer:
        patterns:
          - "*"

    open-pull-requests-limit: 2

    labels:
      - dependencies

    # The go line in go.mod follows x/crypto, which already needs a newer Go
    # than Debian 13's 1.24: the go command then fetches the toolchain go.mod
    # asks for (GOTOOLCHAIN=auto), the way rustup fetches Russh's. A bump that
    # raises the go line needs nothing else.
